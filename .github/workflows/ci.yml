name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check backend/supabase/functions/*/index.ts
      - run: deno test backend/supabase/functions/_shared/*.test.ts

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graveyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/graveyard_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply Supabase test stubs
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/supabase_stubs.sql
      - name: Apply all migrations
        run: |
          for file in backend/supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run SQL integration tests
        run: |
          for file in backend/supabase/tests/*.sql; do
            echo "Testing $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
