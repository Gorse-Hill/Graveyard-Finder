name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo holds lib, test, assets and pubspec. This adds the Android project around them.
      - run: flutter create --platforms=android --project-name graveyard_locator .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-ins (roles and storage tables)
        run: psql -v ON_ERROR_STOP=1 -f ci/supabase_stubs.sql
      - name: Migrations
        run: |
          for f in backend/supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: SQL checks
        run: |
          for f in backend/supabase/tests/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check every function
        run: deno check */index.ts
      - name: Unit tests
        run: deno test --allow-read _shared/

  android:
    name: Android (debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project around lib, assets and pubspec
        run: |
          flutter create --platforms=android --project-name graveyard_locator .
          rm -f test/widget_test.dart

      - name: Add the permissions the app uses
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' "$M"
          grep -c "uses-permission" "$M"

      - run: flutter pub get

      # A release build stops in Android lint inside the image_picker plugin (a crash in lint itself),
      # so CI builds the debug APK, which compiles the whole app and every plugin.
      - run: flutter build apk --debug

      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: graveyard-locator-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
